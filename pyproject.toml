[project]
name = "mewcode"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pyjwt[crypto]>=2.12,<3",
]

[project.scripts]
mewcode = "mewcode.__main__:main"
mewcode-platform = "mewcode.platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mewcode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
markers = [
    "security_contract: validates Phase 0 threat fixtures and safety contracts without executing attacks",
    "runtime_contract: validates the unified Agent Runtime and command execution contracts",
    "executor_security: requires the Phase 2 isolated Docker ExecutionEnvironment",
    "resource_exhaustion: runs bounded resource pressure only inside an isolated executor",
    "platform_postgres: requires the Phase 3 PostgreSQL integration database",
    "platform_github_live: requires a protected Phase 4 GitHub App test repository",
]
