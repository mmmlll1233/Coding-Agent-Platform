name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev

      - name: Run default test gate
        run: >-
          uv run pytest -q --strict-markers --enforce-platform-outcomes
          -m "not executor_security and not resource_exhaustion"

      - name: Verify tests left the checkout clean
        run: >-
          uv run python -c "import subprocess, sys;
          status = subprocess.check_output(
          ['git', 'status', '--porcelain', '--untracked-files=all'], text=True);
          print(status, end='');
          sys.exit(1 if status.strip() else 0)"
