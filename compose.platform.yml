name: mewcode-platform

x-platform-service: &platform-service
  build:
    context: .
    dockerfile: docker/platform/Dockerfile
  restart: "no"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: mewcode
      POSTGRES_USER: mewcode_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/migrator_db_password
    secrets:
      - migrator_db_password
      - api_db_password
      - worker_db_password
      - notifier_db_password
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/00-create-runtime-roles.sh:/docker-entrypoint-initdb.d/00-create-runtime-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mewcode_migrator -d mewcode"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *platform-service
    command: ["db", "upgrade"]
    environment:
      MEWCODE_PLATFORM_DATABASE_URL: postgresql+asyncpg://mewcode_migrator@postgres:5432/mewcode
      MEWCODE_PLATFORM_DATABASE_PASSWORD_FILE: /run/secrets/migrator_db_password
      MEWCODE_PLATFORM_LOG_FORMAT: json
    secrets:
      - migrator_db_password
    depends_on:
      postgres:
        condition: service_healthy

  grant-runtime:
    <<: *platform-service
    command: ["db", "grant-runtime"]
    environment:
      MEWCODE_PLATFORM_DATABASE_URL: postgresql+asyncpg://mewcode_migrator@postgres:5432/mewcode
      MEWCODE_PLATFORM_DATABASE_PASSWORD_FILE: /run/secrets/migrator_db_password
      MEWCODE_PLATFORM_LOG_FORMAT: json
    secrets:
      - migrator_db_password
    depends_on:
      migrate:
        condition: service_completed_successfully

  storage-init:
    <<: *platform-service
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        install -d -m 0700 -o 65532 -g 65532
        /var/lib/mewcode/state /var/lib/mewcode/artifacts
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - platform_state:/var/lib/mewcode/state
      - platform_artifacts:/var/lib/mewcode/artifacts

  api:
    <<: *platform-service
    command: ["api"]
    restart: unless-stopped
    environment:
      MEWCODE_PLATFORM_DATABASE_URL: postgresql+asyncpg://mewcode_api@postgres:5432/mewcode
      MEWCODE_PLATFORM_DATABASE_PASSWORD_FILE: /run/secrets/api_db_password
      MEWCODE_PLATFORM_HOST: 0.0.0.0
      MEWCODE_PLATFORM_PORT: 8080
      MEWCODE_PLATFORM_REPOSITORY_RESOLVER_FACTORY: mewcode.platform.scm:create_repository_resolver
      MEWCODE_PLATFORM_GITHUB_APP_CLIENT_ID: ${MEWCODE_PLATFORM_GITHUB_APP_CLIENT_ID:-}
      MEWCODE_PLATFORM_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      MEWCODE_PLATFORM_ARTIFACT_ROOT: /var/lib/mewcode/artifacts
      MEWCODE_PLATFORM_NOTIFICATIONS_ENABLED: "true"
      MEWCODE_PLATFORM_NOTIFICATION_DESTINATION: feishu:platform
      MEWCODE_PLATFORM_LOG_FORMAT: json
    secrets:
      - api_db_password
      - github_app_private_key
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - platform_artifacts:/var/lib/mewcode/artifacts:ro
    depends_on:
      grant-runtime:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *platform-service
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 330s
    group_add:
      - "${MEWCODE_DOCKER_SOCKET_GID:-0}"
    environment:
      MEWCODE_PLATFORM_DATABASE_URL: postgresql+asyncpg://mewcode_worker@postgres:5432/mewcode
      MEWCODE_PLATFORM_DATABASE_PASSWORD_FILE: /run/secrets/worker_db_password
      MEWCODE_PLATFORM_ATTEMPT_PROCESSOR_FACTORY: mewcode.platform.processing:create_attempt_processor_factory
      MEWCODE_PLATFORM_MAX_CONCURRENT_JOBS: ${MEWCODE_PLATFORM_MAX_CONCURRENT_JOBS:-1}
      MEWCODE_PLATFORM_WORKER_MAX_CONCURRENT_ATTEMPTS: ${MEWCODE_PLATFORM_WORKER_MAX_CONCURRENT_ATTEMPTS:-1}
      MEWCODE_PLATFORM_ATTEMPT_TIMEOUT_SECONDS: ${MEWCODE_PLATFORM_ATTEMPT_TIMEOUT_SECONDS:-3600}
      MEWCODE_PLATFORM_WORKER_SHUTDOWN_GRACE_SECONDS: ${MEWCODE_PLATFORM_WORKER_SHUTDOWN_GRACE_SECONDS:-300}
      MEWCODE_PLATFORM_LLM_PROTOCOL: ${MEWCODE_PLATFORM_LLM_PROTOCOL:-}
      MEWCODE_PLATFORM_LLM_BASE_URL: ${MEWCODE_PLATFORM_LLM_BASE_URL:-}
      MEWCODE_PLATFORM_LLM_MODEL: ${MEWCODE_PLATFORM_LLM_MODEL:-}
      MEWCODE_PLATFORM_LLM_API_KEY_FILE: /run/secrets/platform_llm_api_key
      MEWCODE_PLATFORM_EXECUTOR_IMAGE: ${MEWCODE_PLATFORM_EXECUTOR_IMAGE:-}
      MEWCODE_PLATFORM_PROXY_IMAGE: ${MEWCODE_PLATFORM_PROXY_IMAGE:-}
      MEWCODE_PLATFORM_GITHUB_APP_CLIENT_ID: ${MEWCODE_PLATFORM_GITHUB_APP_CLIENT_ID:-}
      MEWCODE_PLATFORM_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      MEWCODE_PLATFORM_STATE_ROOT: /var/lib/mewcode/state
      MEWCODE_PLATFORM_ARTIFACT_ROOT: /var/lib/mewcode/artifacts
      MEWCODE_PLATFORM_EGRESS_NETWORK: ${MEWCODE_PLATFORM_EGRESS_NETWORK:-mewcode-phase2-egress}
      MEWCODE_PLATFORM_EGRESS_ALLOWLIST: ${MEWCODE_PLATFORM_EGRESS_ALLOWLIST:-pypi.org,files.pythonhosted.org}
      MEWCODE_PLATFORM_SETUP_TIMEOUT_BUDGET_SECONDS: ${MEWCODE_PLATFORM_SETUP_TIMEOUT_BUDGET_SECONDS:-600}
      MEWCODE_PLATFORM_VERIFICATION_TIMEOUT_BUDGET_SECONDS: ${MEWCODE_PLATFORM_VERIFICATION_TIMEOUT_BUDGET_SECONDS:-600}
      MEWCODE_PLATFORM_MAX_REPAIR_ROUNDS: ${MEWCODE_PLATFORM_MAX_REPAIR_ROUNDS:-2}
      MEWCODE_PLATFORM_ARTIFACT_RETENTION_DAYS: ${MEWCODE_PLATFORM_ARTIFACT_RETENTION_DAYS:-7}
      MEWCODE_PLATFORM_METADATA_RETENTION_DAYS: ${MEWCODE_PLATFORM_METADATA_RETENTION_DAYS:-30}
      MEWCODE_PLATFORM_JANITOR_INTERVAL_SECONDS: ${MEWCODE_PLATFORM_JANITOR_INTERVAL_SECONDS:-3600}
      MEWCODE_PLATFORM_NOTIFICATIONS_ENABLED: "true"
      MEWCODE_PLATFORM_NOTIFICATION_DESTINATION: feishu:platform
      MEWCODE_PLATFORM_WORKER_METRICS_PORT: 9091
      MEWCODE_PLATFORM_LOG_FORMAT: json
    secrets:
      - worker_db_password
      - platform_llm_api_key
      - github_app_private_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - platform_state:/var/lib/mewcode/state
      - platform_artifacts:/var/lib/mewcode/artifacts
    networks:
      - default
      - executor-egress
    ports:
      - 127.0.0.1:9091:9091
    depends_on:
      grant-runtime:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  notifier:
    <<: *platform-service
    command: ["notifier"]
    restart: unless-stopped
    environment:
      MEWCODE_PLATFORM_DATABASE_URL: postgresql+asyncpg://mewcode_notifier@postgres:5432/mewcode
      MEWCODE_PLATFORM_DATABASE_PASSWORD_FILE: /run/secrets/notifier_db_password
      MEWCODE_PLATFORM_NOTIFICATIONS_ENABLED: "true"
      MEWCODE_PLATFORM_NOTIFICATION_DESTINATION: feishu:platform
      MEWCODE_PLATFORM_FEISHU_WEBHOOK_URL_FILE: /run/secrets/feishu_webhook_url
      MEWCODE_PLATFORM_FEISHU_SIGNING_SECRET_FILE: /run/secrets/feishu_signing_secret
      MEWCODE_PLATFORM_NOTIFIER_ID: notifier-compose
      MEWCODE_PLATFORM_NOTIFICATION_POLL_MILLISECONDS: 500
      MEWCODE_PLATFORM_NOTIFICATION_LEASE_SECONDS: 60
      MEWCODE_PLATFORM_NOTIFICATION_TIMEOUT_SECONDS: 10
      MEWCODE_PLATFORM_NOTIFICATION_BACKOFF_BASE_SECONDS: 5
      MEWCODE_PLATFORM_NOTIFICATION_BACKOFF_MAX_SECONDS: 900
      MEWCODE_PLATFORM_NOTIFIER_METRICS_PORT: 9092
      MEWCODE_PLATFORM_LOG_FORMAT: json
    secrets:
      - notifier_db_password
      - feishu_webhook_url
      - feishu_signing_secret
    ports:
      - 127.0.0.1:9092:9092
    depends_on:
      grant-runtime:
        condition: service_completed_successfully

secrets:
  migrator_db_password:
    file: ${MEWCODE_MIGRATOR_DB_PASSWORD_FILE:-.mewcode/secrets/migrator_db_password}
  api_db_password:
    file: ${MEWCODE_API_DB_PASSWORD_FILE:-.mewcode/secrets/api_db_password}
  worker_db_password:
    file: ${MEWCODE_WORKER_DB_PASSWORD_FILE:-.mewcode/secrets/worker_db_password}
  notifier_db_password:
    file: ${MEWCODE_NOTIFIER_DB_PASSWORD_FILE:-.mewcode/secrets/notifier_db_password}
  github_app_private_key:
    file: ${MEWCODE_GITHUB_APP_PRIVATE_KEY_FILE:-.mewcode/secrets/github_app_private_key.pem}
  platform_llm_api_key:
    file: ${MEWCODE_PLATFORM_LLM_API_KEY_FILE:-.mewcode/secrets/platform_llm_api_key}
  feishu_webhook_url:
    file: ${MEWCODE_FEISHU_WEBHOOK_URL_FILE:-.mewcode/secrets/feishu_webhook_url}
  feishu_signing_secret:
    file: ${MEWCODE_FEISHU_SIGNING_SECRET_FILE:-.mewcode/secrets/feishu_signing_secret}

volumes:
  platform_postgres_data:
  platform_state:
  platform_artifacts:

networks:
  default:
    name: ${MEWCODE_PLATFORM_CONTROL_NETWORK:-mewcode-platform-control}
  executor-egress:
    name: ${MEWCODE_PLATFORM_EGRESS_NETWORK:-mewcode-phase2-egress}
